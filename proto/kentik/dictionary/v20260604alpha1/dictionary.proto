syntax = "proto3";

package kentik.dictionary.v20260604alpha1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

import "kentik/core/v202303/annotations.proto";

option go_package = "github.com/kentik/api-schema-public/gen/go/kentik/dictionary/v20260604alpha1;dictionary";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Dictionary API"
    version: "v20260604alpha1"
    contact: {
      name: "Kentik API Engineering"
