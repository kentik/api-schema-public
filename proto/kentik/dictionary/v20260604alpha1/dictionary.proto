    }
    description:
        "# Overview\n"
            "The Dictionary API is used for getting all the metadata we can query about using UDE."
            "\n"
            "### Key Features\n"
            "* Get dictionary for your company\n"
            "\n"
  }
  external_docs: {
    url: "https://kb.kentik.com/"
    description: "Kentik Knowledge Base"
  }
  schemes: HTTPS
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "email"
      value: {
        type: TYPE_API_KEY
