service AssetTagsService {
  option (google.api.default_host) = "grpc.api.kentik.com";
  option (kentik.core.v202303.visibility) = SERVICE_VISIBILITY_PUBLIC;
  option (kentik.core.v202303.service_scope) = "admin.device";
  option (kentik.core.v202303.backend_type) = "grpc-connect";

  rpc ListTagKeys(ListTagKeysRequest) returns (ListTagKeysResponse) {
    option (kentik.core.v202303.method_scope) = "admin.device:read";
    option (google.api.http) = {
      get: "/asset_tags/v20260515beta1/keys"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "ListTagKeys"
      summary: "Lists all tag keys."
      description: "Returns a list of tag keys."
    };
  }

  rpc GetTagKey(GetTagKeyRequest) returns (GetTagKeyResponse) {
    option (kentik.core.v202303.method_scope) = "admin.device:read";
    option (google.api.http) = {
      get: "/asset_tags/v20260515beta1/keys/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "GetTagKey"
      summary: "Get a single tag key by id."
      description: "Returns a single tag key."
    };
  }

  rpc CreateTagKey(CreateTagKeyRequest) returns (CreateTagKeyResponse) {
    option (kentik.core.v202303.method_scope) = "admin.device:write";
    option (google.api.http) = {
      post: "/asset_tags/v20260515beta1/keys"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "CreateTagKey"
      summary: "Creates a new tag key."
      description: "Returns the created tag key."
    };
  }

  rpc UpdateTagKey(UpdateTagKeyRequest) returns (UpdateTagKeyResponse) {
    option (kentik.core.v202303.method_scope) = "admin.device:write";
    option (google.api.http) = {
      put: "/asset_tags/v20260515beta1/keys/{id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "UpdateTagKey"
      summary: "Updates the display name of a tag key."
      description: "Returns the updated tag key."
    };
  }

  rpc DeleteTagKey(DeleteTagKeyRequest) returns (DeleteTagKeyResponse) {
    option (kentik.core.v202303.method_scope) = "admin.device:write";
    option (google.api.http) = {
      delete: "/asset_tags/v20260515beta1/keys/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "DeleteTagKey"
      summary: "Deletes a tag key by id."
      description: "Returns an empty response"
    };
  }

  rpc ListTagValues(ListTagValuesRequest) returns (ListTagValuesResponse) {
    option (kentik.core.v202303.method_scope) = "admin.device:read";
    option (google.api.http) = {
      get: "/asset_tags/v20260515beta1/keys/{tag_id}/{asset_type}/values"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "ListTagValues"
      summary: "Lists all tag values by id, optionally filtered by asset type."
      description: "Returns a list of tag values."
    };
  }

  rpc GetTagValues(GetTagValuesRequest) returns (GetTagValuesResponse) {
    option (kentik.core.v202303.method_scope) = "admin.device:read";
    option (google.api.http) = {
      get: "/asset_tags/v20260515beta1/assets/{asset_type}/{asset_id}/values"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "GetTagValues"
      summary: "Gets tag values by asset id and type."
      description: "Returns a list of tag values."
    };
  }

  rpc SetTagValues(SetTagValuesRequest) returns (SetTagValuesResponse) {
    option (kentik.core.v202303.method_scope) = "admin.device:write";
    option (google.api.http) = {
      put: "/asset_tags/v20260515beta1/values"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "SetTagValues"
      summary: "Bulk upserts a tag value for a list of asset ids of a given type."
      description: "Returns a list of tag values."
    };
  }

  rpc DeleteTagValues(DeleteTagValuesRequest) returns (DeleteTagValuesResponse) {
    option (kentik.core.v202303.method_scope) = "admin.device:write";
    option (google.api.http) = {
      post: "/asset_tags/v20260515beta1/values/delete"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "DeleteTagValues"
      summary: "Bulk deletes a tag values for a list of asset ids of a given type."
      description: "Returns an empty response."
    };
  }
