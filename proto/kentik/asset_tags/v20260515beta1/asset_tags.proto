}

// {{.Name}}
message TagValue {
  string tag_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tag key id"}];
  AssetType asset_type = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Tag asset type"}];
