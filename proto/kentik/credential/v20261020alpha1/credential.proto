syntax = "proto3";

package kentik.credential.v20261020alpha1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

import "kentik/core/v202303/annotations.proto";

option go_package = "github.com/kentik/api-schema-public/gen/go/kentik/credential/v20261020alpha1;credential";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Credentials Vault API"
    version: "v20261020alpha1"
    contact: {
      name: "Kentik API Engineering"
      url: "https://github.com/kentik/api-schema-public"
    }
    description:
      "# Overview\n"
      "The Credentials Vault API enables programmatic lifecycle management of credentials stored in Kentik Credential Vault."
      "\n"
      "### Key Features\n"
      "* Create, read, update, and delete of credential groups\n"
      "* Lookup and deletion of individual credential versions\n"
      "* Assignment of consumers (synthetic tests, devices, etc.) to credentials\n"
      "\n"
      "Secret values are write-only: they are accepted on create and update but never returned.\n"
  }
  external_docs: {
    url: "https://kb.kentik.com/"
    description: "Kentik Knowledge Base"
  }
  schemes: HTTPS
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "email"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-CH-Auth-Email"
      }
    }
    security: {
      key: "token"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-CH-Auth-API-Token"
      }
    }
  }
  security: {
    security_requirement: {
      key: "email"
      value: {}
    }
    security_requirement: {
      key: "token"
      value: {}
    }
  }
};

// ========== models ==========

// {{.Name}}
enum CredentialType {
  CREDENTIAL_TYPE_UNSPECIFIED = 0;
  CREDENTIAL_TYPE_BASIC_AUTH = 1;
  CREDENTIAL_TYPE_SNMP_V1 = 2;
  CREDENTIAL_TYPE_SNMP_V2C = 3;
  CREDENTIAL_TYPE_SNMP_V3 = 4;
  CREDENTIAL_TYPE_STREAMING_TELEMETRY = 5;
  CREDENTIAL_TYPE_BGP_MD5 = 6;
  CREDENTIAL_TYPE_API_TOKEN = 7;
  CREDENTIAL_TYPE_OTHER = 8;
  CREDENTIAL_TYPE_SSH_KEY = 9;
  CREDENTIAL_TYPE_SSH_PASSWORD = 10;
  CREDENTIAL_TYPE_AI_API_TOKEN = 11;
  CREDENTIAL_TYPE_MCP_HTTP_HEADERS = 12;
  CREDENTIAL_TYPE_CLOUD = 13;
}

// {{.Name}}
message CreatedBy {
  string id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "User id"}];
  string email = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "User email"}];
  string full_name = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "User full name"}];
}

// {{.Name}}
message Consumer {
  string type = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Consumer type: synth, nms, ai, cloud, deviceconf or mcp"
  }];
  string consumer_id = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Id of the consuming entity (synthetic test id, device id, etc.)"
  }];
}

// {{.Name}}
message Credential {
  string id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Credential id"}];
  string name = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Fully qualified credential name, `<group>.<key>`"
  }];
  uint32 version = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Credential version"}];
  string description = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Purpose of this credential"}];
  CredentialType type = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Credential type"}];
  google.protobuf.Timestamp cdate = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp edate = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  CreatedBy created_by = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated string labels = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Label ids"}];
  repeated Consumer consumers = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// {{.Name}}
message CredentialGroup {
  string id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Pipe-delimited ids of the latest version of each credential in the group"
  }];
  string name = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Credential group name"}];
  uint32 version = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Group version"}];
  string description = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Purpose of this credential group"}];
  CredentialType type = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Credential type"}];
  google.protobuf.Timestamp cdate = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp edate = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  CreatedBy created_by = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated string labels = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Label ids"}];
  repeated Consumer consumers = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated Credential credentials = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// {{.Name}}
message CredentialOverview {
  string name = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Credential group name"}];
  CredentialType type = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Credential type"}];
}

// {{.Name}}
message Token {
  string key = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Credential key within the group, e.g. `username`"},
    (google.api.field_behavior) = REQUIRED
  ];
  string value = 2 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Secret value. On update, an empty value keeps the existing secret."
    },
    (google.api.field_behavior) = INPUT_ONLY
  ];
}

// ========== requests / responses ==========

// {{.Name}}
message ListCredentialsRequest {}

// {{.Name}}
message ListCredentialsResponse {
  repeated Credential credentials = 1;
}

// {{.Name}}
message ListCredentialGroupsRequest {}

// {{.Name}}
message ListCredentialGroupsResponse {
  repeated CredentialGroup groups = 1;
}

// {{.Name}}
message ListCredentialOverviewsRequest {}

// {{.Name}}
message ListCredentialOverviewsResponse {
  repeated CredentialOverview overviews = 1;
}

// {{.Name}}
message GetCredentialGroupRequest {
  string name = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Credential group name"},
    (google.api.field_behavior) = REQUIRED
  ];
}

// {{.Name}}
message GetCredentialGroupResponse {
  CredentialGroup group = 1;
}

// {{.Name}}
message GetCredentialRequest {
  string name = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Fully qualified credential name, `<group>.<key>`"},
    (google.api.field_behavior) = REQUIRED
  ];
  optional uint32 version = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Specific version to fetch. Defaults to the latest."
  }];
  bool all_versions = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Return every version, newest first"
  }];
}

// {{.Name}}
message GetCredentialResponse {
  repeated Credential credentials = 1;
}

// {{.Name}}
message CreateCredentialGroupRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  CredentialType type = 2 [(google.api.field_behavior) = REQUIRED];
  string description = 3;
  repeated Token tokens = 4 [(google.api.field_behavior) = REQUIRED];
  repeated string labels = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Label ids"}];
}

// {{.Name}}
message CreateCredentialGroupResponse {
  CredentialGroup group = 1;
}

// {{.Name}}
message UpdateCredentialGroupRequest {
  string name = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Credential group name"},
    (google.api.field_behavior) = REQUIRED
  ];
  CredentialType type = 2 [(google.api.field_behavior) = REQUIRED];
  string description = 3;
  repeated Token tokens = 4 [(google.api.field_behavior) = REQUIRED];
  repeated string labels = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Label ids"}];
}

// {{.Name}}
message UpdateCredentialGroupResponse {
  CredentialGroup group = 1;
}

// {{.Name}}
message DeleteCredentialGroupRequest {
  string name = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Credential group name"},
    (google.api.field_behavior) = REQUIRED
  ];
}

// {{.Name}}
message DeleteCredentialGroupResponse {}

// {{.Name}}
message DeleteCredentialRequest {
  string name = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Fully qualified credential name, `<group>.<key>`"},
    (google.api.field_behavior) = REQUIRED
  ];
  uint32 version = 2 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Credential version; versions start at 0"},
    (google.api.field_behavior) = REQUIRED
  ];
}

// {{.Name}}
message DeleteCredentialResponse {}

// {{.Name}}
message AssignConsumerRequest {
  string name = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Fully qualified credential name, `<group>.<key>`"},
    (google.api.field_behavior) = REQUIRED
  ];
  Consumer consumer = 2 [(google.api.field_behavior) = REQUIRED];
}

// {{.Name}}
message AssignConsumerResponse {
  Credential credential = 1;
}

// ========== service ==========

service CredentialService {
  option (google.api.default_host) = "grpc.api.kentik.com";
  option (kentik.core.v202303.visibility) = SERVICE_VISIBILITY_PUBLIC;
  option (kentik.core.v202303.service_scope) = "admin.credential";
  option (kentik.core.v202303.backend_type) = "grpc-connect";

  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse) {
    option (kentik.core.v202303.method_permission) = "credential_vault::read";
    option (google.api.http) = {
      get: "/credential/v20261020alpha1/credentials"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "ListCredentials"
      summary: "List credentials."
      description: "Returns the latest version of every credential."
    };
  }

  rpc GetCredential(GetCredentialRequest) returns (GetCredentialResponse) {
    option (kentik.core.v202303.method_permission) = "credential_vault::read";
    option (google.api.http) = {
      get: "/credential/v20261020alpha1/credentials/{name}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "GetCredential"
      summary: "Get a credential by name."
      description: "Returns the latest, a specific, or every version of a credential."
    };
  }

  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse) {
    option (kentik.core.v202303.method_permission) = "credential_vault::delete";
    option (google.api.http) = {
      delete: "/credential/v20261020alpha1/credentials/{name}/versions/{version}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "DeleteCredential"
      summary: "Delete a credential version."
      description: "Deletes a single version of a credential. Fails if the credential has consumers."
    };
  }

  rpc AssignConsumer(AssignConsumerRequest) returns (AssignConsumerResponse) {
    option (kentik.core.v202303.method_permission) = "credential_vault::update";
    option (google.api.http) = {
      put: "/credential/v20261020alpha1/credentials/{name}/consumer"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "AssignConsumer"
      summary: "Assign a consumer to a credential."
      description: "Records that an entity (synthetic test, device, etc.) uses the credential."
    };
  }

  rpc ListCredentialGroups(ListCredentialGroupsRequest) returns (ListCredentialGroupsResponse) {
    option (kentik.core.v202303.method_permission) = "credential_vault::read";
    option (google.api.http) = {
      get: "/credential/v20261020alpha1/groups"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "ListCredentialGroups"
      summary: "List credential groups."
      description: "Returns every credential group with the latest version of its credentials."
    };
  }

  rpc ListCredentialOverviews(ListCredentialOverviewsRequest) returns (ListCredentialOverviewsResponse) {
    option (kentik.core.v202303.method_permission) = "credential_vault::read";
    option (google.api.http) = {
      get: "/credential/v20261020alpha1/overviews"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "ListCredentialOverviews"
      summary: "List credential group names and types."
      description: "Returns a lightweight name and type listing of every credential group, for lookups."
    };
  }

  rpc GetCredentialGroup(GetCredentialGroupRequest) returns (GetCredentialGroupResponse) {
    option (kentik.core.v202303.method_permission) = "credential_vault::read";
    option (google.api.http) = {
      get: "/credential/v20261020alpha1/groups/{name}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "GetCredentialGroup"
      summary: "Get a credential group by name."
      description: "Returns a single credential group."
    };
  }

  rpc CreateCredentialGroup(CreateCredentialGroupRequest) returns (CreateCredentialGroupResponse) {
    option (kentik.core.v202303.method_permission) = "credential_vault::create";
    option (google.api.http) = {
      post: "/credential/v20261020alpha1/groups"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "CreateCredentialGroup"
      summary: "Create a credential group."
      description: "Creates one credential per token and returns the created group."
    };
  }

  rpc UpdateCredentialGroup(UpdateCredentialGroupRequest) returns (UpdateCredentialGroupResponse) {
    option (kentik.core.v202303.method_permission) = "credential_vault::update";
    option (google.api.http) = {
      put: "/credential/v20261020alpha1/groups/{name}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "UpdateCredentialGroup"
      summary: "Update a credential group."
      description: "Tokens with a value create a new credential version; tokens without one only update metadata."
    };
  }

  rpc DeleteCredentialGroup(DeleteCredentialGroupRequest) returns (DeleteCredentialGroupResponse) {
    option (kentik.core.v202303.method_permission) = "credential_vault::delete";
    option (google.api.http) = {
      delete: "/credential/v20261020alpha1/groups/{name}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "DeleteCredentialGroup"
      summary: "Delete a credential group."
      description: "Deletes every version of every credential in the group. Fails if any credential has consumers."
    };
  }
}
